[project]
name = "mandi-automl"
version = "0.1.0"
description = "Drift-aware AutoML for weekly onion mandi price forecasting"
readme = "README.md"
# Upper bound: autokeras 3.0.0 publishes Python classifiers only through 3.11.
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.152.0",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "tabulate>=0.10.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# `uv run` keeps the research stack installed so notebooks and the AutoKeras /
# KerasTuner baselines work without re-syncing. The Docker image instead uses
# `uv sync --no-default-groups`, which installs neither dev nor research.
default-groups = ["dev", "research"]

[project.scripts]
# One command to bring up the whole app: `uv run web-start`
web-start = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automl", "app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, B bugbear, UP pyupgrade,
# D pydocstyle (docstrings are required by the project code standards).
select = ["E", "W", "F", "I", "B", "UP", "D"]
ignore = [
    "D107",  # __init__ docstring: covered by the class docstring
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # starlette's TestClient nudges towards httpx2; not our call to make here.
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
    "ignore::UserWarning:starlette.testclient",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
research = [
    "autokeras>=3.0.0",
    "evidently>=0.7.23",
    "jupyter>=1.1.1",
    "keras-tuner>=1.4.8",
    "matplotlib>=3.11.2",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "tensorboard>=2.21.0",
    "tensorflow>=2.21.0",
]
