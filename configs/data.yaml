# Phase 1 configuration — multi-crop, multi-state.
#
# SOURCE NOTE (see README): the CEDA Agmarknet portal exposes daily prices at STATE
# level. Its district-level endpoint returns HTTP 500/504, and agmarknet.gov.in v2
# requires a captcha. The modelled entity is therefore a state-wide aggregate of mandi
# modal prices, not a single mandi. The column is still called `market` so the code
# stays generic.

# Crops to model. One tuned model is registered per crop. IDs come from
# GET /api/commodities on the CEDA portal.
crops:
  - {id: 23,  name: Onion,    slug: onion}
  - {id: 24,  name: Potato,   slug: potato}
  - {id: 78,  name: Tomato,   slug: tomato}
  - {id: 154, name: Cabbage,  slug: cabbage}

source:
  name: ceda_agmarknet
  base_url: https://agmarknet.ceda.ashoka.edu.in
  prices_path: /api/prices
  calculation_type: d       # daily
  entity_level: state
  chunk_years: 1
  request_timeout_s: 240
  retries: 3
  sleep_between_s: 1.0
  max_workers: 3            # polite concurrency against a slow public endpoint

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  weekly_parquet: data/processed/weekly.parquet
  daily_csv: data/processed/daily_clean.csv
  quality_report: results/data_quality.md
  quality_plot: results/weekly_series.png
  provenance: data/raw/provenance.json

date_range:
  start: "2018-01-01"
  end: "2025-10-30"         # last date CEDA returned on 2026-10-18

# census_state_id values come from GET /api/states?commodity_id=<id>
candidate_markets:
  - {id: 27, name: Maharashtra}
  - {id: 29, name: Karnataka}
  - {id: 24, name: Gujarat}
  - {id: 23, name: Madhya Pradesh}
  - {id: 8,  name: Rajasthan}
  - {id: 9,  name: Uttar Pradesh}
  - {id: 19, name: West Bengal}
  - {id: 10, name: Bihar}

# Markets whose missing-week fraction is within this much of the best-covered market
# are treated as equally complete, and the candidate_markets order above breaks the
# tie. Without this, a two-week difference out of 409 would silently drop Maharashtra,
# India's most important onion market.
coverage_tie_tolerance: 0.02

n_markets: 6                # keep the 6 best-covered states per crop

clean:
  price_column: modal_price       # rupees per quintal
  min_price: 100.0                # below this is a data-entry error, not a market price
  max_price: 20000.0
  outlier_log_mad_threshold: 5.0  # robust z-score on log price, within a series

aggregate:
  frequency: W-MON          # weekly buckets labelled by the Monday that starts them
  agg: mean
  min_days_per_week: 3      # a week with fewer observed days is treated as missing

# Stop rule from the project spec.
max_missing_week_fraction: 0.10
# What to do when a series breaks it:
#   exclude -> drop that series, name it in the quality report, carry on (default).
#   halt    -> stop the pipeline, as the single-crop spec originally required.
on_stop_rule_violation: exclude
