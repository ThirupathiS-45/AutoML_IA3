# Phase 4 input: the LightGBM hyperparameters our Bayesian optimizer searches.
# Provisional ranges; revisit once Phase 3 shows how the defaults behave.
model: lightgbm

hyperparameters:
  learning_rate:
    type: float
    low: 0.005
    high: 0.3
    log: true
  num_leaves:
    type: int
    low: 7
    high: 127
  max_depth:
    type: int
    low: 3
    high: 12
  min_child_samples:
    type: int
    low: 5
    high: 60
  subsample:
    type: float
    low: 0.5
    high: 1.0
    log: false
  colsample_bytree:
    type: float
    low: 0.5
    high: 1.0
    log: false
  reg_lambda:
    type: float
    low: 0.001
    high: 10.0
    log: true
  n_estimators:
    type: int
    low: 50
    high: 600
